# nginx site for axiomtext.dev (static docs + demo + playground).
# Installed by deploy/scripts/server-setup.sh, which also adds HTTPS with certbot.
# Serves /var/www/axiomtext.dev/current → releases/<release> (switched by each deploy).
# Other sites on the server are not affected.

# www.axiomtext.dev → axiomtext.dev
server {
    listen 80;
    listen [::]:80;
    server_name www.axiomtext.dev;
    return 301 https://axiomtext.dev$request_uri;
}

server {
    listen 80;
    listen [::]:80;
    server_name axiomtext.dev;

    root /var/www/axiomtext.dev/current;
    index index.html;

    # Security headers (the playground also sets its own strict CSP in the page).
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # Compression for text files.
    gzip on;
    gzip_comp_level 6;
    gzip_types text/css application/javascript application/json image/svg+xml text/plain;

    # Files with a content hash in their name never change: cache for a year.
    location ~* ^/(_astro|playground/assets)/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    # Fonts and images: cache for a week.
    location ~* \.(woff2?|ttf|png|jpe?g|gif|webp|avif|svg|ico)$ {
        add_header Cache-Control "public, max-age=604800";
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    # Pages: always check for a new version.
    location / {
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        try_files $uri $uri/ $uri.html =404;
    }

    error_page 404 /404.html;
}
