name: Feature request
description: Suggest a feature or improvement
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: What would you like to happen?
  - type: input
    id: compare
    attributes:
      label: Do other editors (CKEditor, TinyMCE, Tiptap…) have this? How do they do it?
