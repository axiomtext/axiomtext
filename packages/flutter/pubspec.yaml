name: axiomtext
description: >-
  Free, open-source rich text editor for Flutter with a visual math equation editor built in.
  Tables, images, Markdown, 10 languages. Android, iOS, macOS and Web.
version: 0.2.1
homepage: https://axiomtext.dev
repository: https://github.com/axiomtext/axiomtext/tree/main/packages/flutter
issue_tracker: https://github.com/axiomtext/axiomtext/issues
documentation: https://axiomtext.dev/frameworks/flutter/
funding:
  - https://www.patreon.com/axiomtext
topics:
  - editor
  - rich-text
  - math
  - latex
  - wysiwyg

environment:
  sdk: ">=3.6.0 <4.0.0"
  flutter: ">=3.27.0"

platforms:
  android:
  ios:
  macos:
  web:

dependencies:
  flutter:
    sdk: flutter
  flutter_math_fork: ^0.7.4
  image_picker: ^1.1.2
  markdown: ^7.3.0
  meta: ^1.11.0
  url_launcher: ^6.3.0
  web: ^1.1.0
  webview_flutter: ^4.10.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  assets:
    - assets/editor/
    - assets/editor/fonts/
