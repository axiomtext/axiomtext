<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover"
    />
    <!--
      Strict policy (FLT-017): only the engine's own files run; no network requests, frames,
      forms or plugins. Images may be https:, data: or blob: (inserted or pasted pictures).
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self' file:; style-src 'self' file: 'unsafe-inline'; font-src 'self' file: data:; img-src 'self' file: data: blob: https:; media-src 'self' file: data: blob: https:; connect-src 'none'; frame-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'"
    />
    <meta name="referrer" content="no-referrer" />
    <title>AxiomText</title>
    <link rel="stylesheet" href="editor.css" />
  </head>
  <body>
    <div id="editor"></div>
    <script src="engine.js"></script>
  </body>
</html>
