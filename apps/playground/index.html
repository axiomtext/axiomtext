<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <script src="%BASE_URL%theme-init.js"></script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self' ws:"
    />
    <meta
      name="description"
      content="AxiomText playground — free, open-source rich text and math editor."
    />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <title>AxiomText Playground</title>
  </head>
  <body>
    <header class="app-bar">
      <a class="brand" href="https://axiomtext.dev" aria-label="AxiomText home">
        <svg class="brand__mark" viewBox="0 0 32 32" width="28" height="28" aria-hidden="true">
          <defs>
            <linearGradient id="ax-grad" x1="0" y1="0" x2="1" y2="1">
              <stop offset="0" stop-color="#6366f1" />
              <stop offset="1" stop-color="#a855f7" />
            </linearGradient>
          </defs>
          <rect width="32" height="32" rx="8" fill="url(#ax-grad)" />
          <path
            d="M9 23 L15 9 L21 23 M11.6 18 H18.4"
            fill="none"
            stroke="#fff"
            stroke-width="2.4"
            stroke-linecap="round"
            stroke-linejoin="round"
          />
          <path
            d="M20 13 L25 20 M25 13 L20 20"
            fill="none"
            stroke="#fff"
            stroke-opacity="0.85"
            stroke-width="2"
            stroke-linecap="round"
          />
        </svg>
        <span class="brand__name">AxiomText</span>
        <span class="badge">Playground</span>
      </a>
      <div class="app-bar__actions">
        <label class="lang-select">
          <span class="visually-hidden">Editor type</span>
          <select id="mode-select" aria-label="Editor type">
            <option value="classic">Classic</option>
            <option value="inline">Inline</option>
            <option value="balloon">Balloon</option>
          </select>
        </label>
        <label class="lang-select">
          <span class="visually-hidden">Interface language</span>
          <select id="lang-select" aria-label="Interface language">
            <option value="en">English</option>
            <option value="bn">বাংলা</option>
            <option value="hi">हिन्दी</option>
            <option value="ar">العربية</option>
            <option value="es">Español</option>
            <option value="fr">Français</option>
            <option value="de">Deutsch</option>
            <option value="pt">Português</option>
            <option value="zh">简体中文</option>
            <option value="ja">日本語</option>
          </select>
        </label>
        <a
          class="link"
          href="https://github.com/axiomtext/axiomtext"
          target="_blank"
          rel="noopener noreferrer"
          >GitHub</a
        >
        <button
          type="button"
          class="icon-button"
          id="theme-toggle"
          aria-label="Toggle dark mode"
        ></button>
        <button
          type="button"
          class="icon-button"
          id="panel-toggle"
          aria-label="Developer panel"
          aria-expanded="false"
          aria-controls="dev-panel"
        ></button>
      </div>
    </header>

    <main class="stage">
      <div class="intro">
        <h1>Free rich text &amp; math editor</h1>
        <p>MIT licensed · runs in your browser · no server, no limits.</p>
      </div>
      <div id="editor"></div>
      <p class="hint">
        Tip: press <kbd>Alt</kbd>+<kbd>F10</kbd> to jump to the toolbar, <kbd>Esc</kbd> to return to
        the text.
      </p>
    </main>

    <aside class="dev-panel" id="dev-panel" aria-label="Developer panel" aria-hidden="true">
      <div class="dev-panel__header">
        <div class="tabs" role="tablist" aria-label="Output format">
          <button
            type="button"
            role="tab"
            id="tab-json"
            aria-selected="true"
            aria-controls="out-json"
          >
            JSON
          </button>
          <button
            type="button"
            role="tab"
            id="tab-html"
            aria-selected="false"
            aria-controls="out-html"
            tabindex="-1"
          >
            HTML
          </button>
          <button
            type="button"
            role="tab"
            id="tab-md"
            aria-selected="false"
            aria-controls="out-md"
            tabindex="-1"
          >
            Markdown
          </button>
        </div>
        <button
          type="button"
          class="icon-button"
          id="panel-close"
          aria-label="Close developer panel"
        ></button>
      </div>
      <pre id="out-json" role="tabpanel" aria-labelledby="tab-json" data-testid="json"></pre>
      <pre id="out-html" role="tabpanel" aria-labelledby="tab-html" data-testid="html" hidden></pre>
      <pre id="out-md" role="tabpanel" aria-labelledby="tab-md" data-testid="markdown" hidden></pre>
    </aside>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
